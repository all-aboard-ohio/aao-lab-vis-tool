<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>Imagine Your Rail Line | AAO Data Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Single-page-app fallback for GitHub Pages. Because this is a static host
      with no server-side routing, any unknown path is served this file. We
      redirect back to the app root so the client can take over.
    -->
    <script>
      sessionStorage.setItem('aao-redirect', location.pathname + location.search)
      location.replace('/')
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 3rem">
      Redirecting to <a href="/">Imagine Your Rail Line</a>…
    </p>
  </body>
</html>
